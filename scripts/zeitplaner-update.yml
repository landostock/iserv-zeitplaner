name: Zeitplaner-Update vorbereiten
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version aus den Zeitplaner-Einstellungen (zum Beispiel 1.0.0-rc5)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: zeitplaner-update
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Geprüften Update-Zweig vorbereiten
        env:
          UPDATE_VERSION: ${{ inputs.version }}
        run: node scripts/prepare-personal-update.mjs "$UPDATE_VERSION"
